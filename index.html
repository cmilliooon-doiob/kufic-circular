<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكوين للخط الكوفي المربع - تصميم الاستاذ : يوسف حمد الصييفي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ed;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --primary: #111111;
            --gold: #c5a059;
            --border: #dcd6c8;
            --accent: #8b5a2b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: var(--primary);
        }

        .designer-credit {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .canvas-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #ffffff;
            cursor: pointer;
            border: 2px solid var(--primary);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.03);
            max-width: 100%;
            height: auto;
        }

        .sidebar {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        .tools-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button, select {
            padding: 8px 12px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            background: #f9f9f9;
            color: var(--text-color);
            transition: all 0.2s;
        }

        button:hover, select:hover {
            background: #eae5d9;
        }

        button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        button.gold-btn {
            background: var(--gold);
            color: #fff;
            border-color: var(--gold);
        }

        .action-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
        }
        .action-btn:hover {
            background: #333;
        }

        .lock-badge {
            background: #fffae6;
            border: 1px solid #ffe58f;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #d48806;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-section {
            border-top: 1px dashed var(--border);
            padding-top: 10px;
        }

        input[type="text"] {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            box-sizing: border-box;
        }

        .hint {
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>تكوين للخط الكوفي المربع</h1>
        <div class="designer-credit">تصميم الاستاذ : يوسف حمد الصييفي</div>
    </header>

    <div class="main-container">
        <!-- لوحة الشبكة المربعة -->
        <div class="canvas-card">
            <canvas id="kuficCanvas" width="550" height="550"></canvas>
            <div class="hint" style="margin-top: 10px;">انقر أو اسحب على المربعات للرسم والتكوين</div>
        </div>

        <!-- لوحة التحكم -->
        <div class="sidebar">
            <div class="lock-badge">
                <span id="lockStatusText">🔓 الشبكية مفتوحة</span>
                <button onclick="toggleGridLock()" id="lockBtn" style="padding: 3px 8px; font-size: 0.75rem;">قفل الشبكية</button>
            </div>

            <!-- النماذج الجاهزة -->
            <div class="control-group">
                <label>النماذج الجاهزة:</label>
                <select id="presetsSelect" onchange="loadPreset()">
                    <option value="empty">شبكة فارغة</option>
                    <option value="hamza">حرف الهمزة (ء) الهندسي</option>
                </select>
            </div>

            <!-- الأدوات -->
            <div class="control-group">
                <label>أدوات الكتابة:</label>
                <div class="tools-row">
                    <button id="toolBlack" class="active" onclick="setTool(1)">◼ أسود أساسي</button>
                    <button id="toolGold" class="gold-btn" onclick="setTool(2)">🟨 تذهيب</button>
                    <button id="toolEraser" onclick="setTool(0)">🧹 ممحاة</button>
                </div>
            </div>

            <!-- أبعاد الشبكة -->
            <div class="control-group" id="gridSettingsGroup">
                <label>أبعاد الشبكة المربعة (عدد الخلايا):</label>
                <div style="display: flex; gap: 10px;">
                    <div style="flex:1;">
                        <span class="hint">الأعمدة/الصفوف:</span>
                        <input type="range" id="gridSizeRange" min="10" max="30" value="16" style="width:100%" onchange="updateGridDimensions()">
                    </div>
                </div>
            </div>

            <!-- التصدير -->
            <div class="control-group" style="gap: 8px;">
                <label>التصدير والحفظ:</label>
                <button class="action-btn" onclick="exportTransparentPNG()">تحميل كصورة شفافة (Transparent PNG)</button>
                <button class="action-btn" style="background:#8b5a2b;" onclick="exportPDF()">تحميل كملف PDF</button>
                <button onclick="clearCanvas()" style="background:#f2dede; color:#a94442; border-color:#ebccd1;">مسح اللوحة بالكامل</button>
            </div>

            <!-- قسم المشرف -->
            <div class="admin-section" id="adminSection">
                <label style="color: var(--accent);">إدارة النماذج (المشرف):</label>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 5px;">
                    <input type="text" id="newPresetName" placeholder="اسم النموذج الجديد...">
                    <button onclick="addNewPreset()" style="background: var(--accent); color:#fff; border:none; padding:6px; border-radius:4px; font-size:0.8rem;">حفظ التصميم كنموذج جاهز</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('kuficCanvas');
        const ctx = canvas.getContext('2d');

        let gridSize = 16; // عدد الخلايا افتراضياً
        let isLocked = false;
        let currentTool = 1; // 1: أسود, 2: ذهبي, 0: ممحاة

        let gridState = Array(gridSize).fill().map(() => Array(gridSize).fill(0));

        // إعداد حرف الهمزة (ء) الهندسي داخل الشبكة المربعة الافتراضية 16x16
        function createHamzaPreset() {
            let preset = Array(16).fill().map(() => Array(16).fill(0));
            // رسم شكل هندسي متناسق للهمزة (ء) في وسط الشبكة المربعة
            // رأس الهمزة (قوس كوفي مربع مصغر)
            for (let c = 7; c <= 9; c++) {
                preset[5][c] = 1;
            }
            preset[6][6] = 1;
            preset[6][10] = 1;
            preset[7][7] = 1;
            preset[7][9] = 1;
            preset[8][8] = 1;
            
            // جسم الهمزة / النزول المائل الهندسي الكوفي
            preset[9][8] = 1;
            preset[10][7] = 1;
            preset[11][6] = 1;
            return preset;
        }

        let customPresets = {
            "empty": Array(16).fill().map(() => Array(16).fill(0)),
            "hamza": createHamzaPreset()
        };

        function drawGrid(isExporting = false, transparentBg = false) {
            const width = canvas.width;
            const height = canvas.height;
            const cellSize = width / gridSize;

            if (isExporting && transparentBg) {
                ctx.clearRect(0, 0, width, height);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);
            }

            // رسم الخلايا الملونة
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    let x = c * cellSize;
                    let y = r * cellSize;

                    if (gridState[r][c] === 1) {
                        ctx.fillStyle = '#111111';
                        ctx.fillRect(x, y, cellSize, cellSize);
                    } else if (gridState[r][c] === 2) {
                        ctx.fillStyle = '#c5a059';
                        ctx.fillRect(x, y, cellSize, cellSize);
                    }

                    // رسم الخطوط الشبكية المزدوجة والهندسية كالمرجع المرفق
                    if (!isExporting) {
                        ctx.strokeStyle = '#e6e0d4';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x, y, cellSize, cellSize);

                        // خط إضافي داخلي لإعطاء مظهر الخط المربع المزدوج (Double-line grid effect)
                        ctx.strokeStyle = '#f2efe9';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(x + 3, y + 3, cellSize - 6, cellSize - 6);
                    }
                }
            }

            // إطار خارجي هندسي عند التصدير
            if (isExporting) {
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 3;
                ctx.strokeRect(0, 0, width, height);
            }
        }

        let isMouseDown = false;

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            handleCanvasInteraction(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                handleCanvasInteraction(e);
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        function handleCanvasInteraction(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            const cellSize = canvas.width / gridSize;
            let c = Math.floor(x / cellSize);
            let r = Math.floor(y / cellSize);

            if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
                if (gridState[r][c] !== currentTool) {
                    gridState[r][c] = currentTool;
                    drawGrid();
                }
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('toolBlack').classList.remove('active');
            document.getElementById('toolGold').classList.remove('active');
            document.getElementById('toolEraser').classList.remove('active');

            if (tool === 1) document.getElementById('toolBlack').classList.add('active');
            if (tool === 2) document.getElementById('toolGold').classList.add('active');
            if (tool === 0) document.getElementById('toolEraser').classList.add('active');
        }

        function toggleGridLock() {
            isLocked = !isLocked;
            const btn = document.getElementById('lockBtn');
            const statusText = document.getElementById('lockStatusText');
            const settingsGroup = document.getElementById('gridSettingsGroup');

            if (isLocked) {
                btn.textContent = 'إلغاء القفل';
                btn.style.background = '#d48806';
                btn.style.color = '#fff';
                statusText.textContent = '🔒 الشبكية مقفلة';
                settingsGroup.style.opacity = '0.4';
                settingsGroup.style.pointerEvents = 'none';
            } else {
                btn.textContent = 'قفل الشبكية';
                btn.style.background = '';
                btn.style.color = '';
                statusText.textContent = '🔓 الشبكية مفتوحة';
                settingsGroup.style.opacity = '1';
                settingsGroup.style.pointerEvents = 'auto';
            }
        }

        function updateGridDimensions() {
            if (isLocked) return;
            const newSize = parseInt(document.getElementById('gridSizeRange').value);
            if (newSize !== gridSize) {
                gridSize = newSize;
                gridState = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
                drawGrid();
            }
        }

        function clearCanvas() {
            gridState = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
            drawGrid();
        }

        function exportTransparentPNG() {
            drawGrid(true, true);
            const link = document.createElement('a');
            link.download = 'kufic-square-design.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            drawGrid(false, false);
        }

        function exportPDF() {
            drawGrid(true, false);
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            const pageWidth = pdf.internal.pageSize.getWidth();
            const imgSize = 140;
            const xPos = (pageWidth - imgSize) / 2;

            pdf.setFontSize(18);
            pdf.text('تكوين للخط الكوفي المربع', pageWidth / 2, 25, { align: 'center' });
            
            pdf.setFontSize(11);
            pdf.setTextColor(139, 90, 43);
            pdf.text('تصميم الاستاذ : يوسف حمد الصييفي', pageWidth / 2, 33, { align: 'center' });

            pdf.addImage(imgData, 'PNG', xPos, 45, imgSize, imgSize);
            pdf.save('kufic-square-design.pdf');
            drawGrid(false, false);
        }

        function addNewPreset() {
            const name = document.getElementById('newPresetName').value.trim();
            if (!name) {
                alert('الرجاء إدخال اسم للنموذج');
                return;
            }
            customPresets[name] = JSON.parse(JSON.stringify(gridState));
            
            const select = document.getElementById('presetsSelect');
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            select.appendChild(option);

            document.getElementById('newPresetName').value = '';
            alert('تم حفظ التصميم كنموذج جاهز بنجاح!');
        }

        function loadPreset() {
            const val = document.getElementById('presetsSelect').value;
            if (!val) return;
            if (customPresets[val]) {
                gridState = JSON.parse(JSON.stringify(customPresets[val]));
                gridSize = gridState.length;
                document.getElementById('gridSizeRange').value = gridSize;
                drawGrid();
            }
        }

        // رسم الشبكة الأولية
        drawGrid();
    </script>
</body>
</html>
