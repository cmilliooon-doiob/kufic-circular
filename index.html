<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكوين للخط الكوفي الدائري</title>
    <!-- استدعاء مكتبة jsPDF لتصدير ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ed;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --primary: #111111;
            --gold: #c5a059;
            --gold-hover: #d4af37;
            --border: #e2dcd0;
            --accent: #8b5a2b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .designer-credit {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .canvas-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        canvas {
            background: #ffffff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.03);
            max-width: 100%;
            height: auto;
        }

        .sidebar {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        .tools-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button, select {
            padding: 8px 12px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            background: #f9f9f9;
            color: var(--text-color);
            transition: all 0.2s;
        }

        button:hover, select:hover {
            background: #eae5d9;
        }

        button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        button.gold-btn {
            background: var(--gold);
            color: #fff;
            border-color: var(--gold);
        }
        button.gold-btn.active {
            background: #9c7c3d;
        }

        .action-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
        }
        .action-btn:hover {
            background: #333;
        }

        .lock-badge {
            background: #fffae6;
            border: 1px solid #ffe58f;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #d48806;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-section {
            border-top: 1px dashed var(--border);
            padding-top: 10px;
            margin-top: 5px;
        }

        input[type="text"] {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            box-sizing: border-box;
        }

        .hint {
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>تكوين للخط الكوفي الدائري</h1>
        <div class="designer-credit">تصميم الاستاذ : يوسف حمد الصييفي</div>
    </header>

    <div class="main-container">
        <!-- لوحة الرسم -->
        <div class="canvas-card">
            <canvas id="kuficCanvas" width="550" height="550"></canvas>
            <div class="hint" style="margin-top: 10px;">انقر أو اسحب على الخلايا الدائرية للكتابة</div>
        </div>

        <!-- لوحة التحكم والتحدث -->
        <div class="sidebar">
            <!-- حالة القفل -->
            <div class="lock-badge">
                <span id="lockStatusText">🔓 الشبكية مفتوحة للتعديل</span>
                <button onclick="toggleGridLock()" id="lockBtn" style="padding: 3px 8px; font-size: 0.75rem;">قفل الشبكية</button>
            </div>

            <!-- النماذج الجاهزة -->
            <div class="control-group">
                <label>النماذج الجاهزة:</label>
                <select id="presetsSelect" onchange="loadPreset()">
                    <option value="">-- اختر نموذجاً --</option>
                    <option value="empty">دائرة فارغة</option>
                </select>
            </div>

            <!-- الأدوات -->
            <div class="control-group">
                <label>أدوات الكتابة:</label>
                <div class="tools-row">
                    <button id="toolBlack" class="active" onclick="setTool(1)">◼ أسود أساسي</button>
                    <button id="toolGold" class="gold-btn" onclick="setTool(2)">🟨 تذهيب</button>
                    <button id="toolEraser" onclick="setTool(0)">🧹 ممحاة</button>
                </div>
            </div>

            <!-- إعدادات الشبكة (تتأثر بالقفل) -->
            <div class="control-group" id="gridSettingsGroup">
                <label>أبعاد الشبكية الدائرية:</label>
                <div style="display: flex; gap: 10px;">
                    <div style="flex:1;">
                        <span class="hint">الحلقات:</span>
                        <input type="range" id="ringsRange" min="3" max="8" value="5" style="width:100%" onchange="updateGridDimensions()">
                    </div>
                    <div style="flex:1;">
                        <span class="hint">القطاعات:</span>
                        <input type="range" id="sectorsRange" min="20" max="60" value="36" style="width:100%" onchange="updateGridDimensions()">
                    </div>
                </div>
            </div>

            <!-- التصدير -->
            <div class="control-group" style="gap: 8px; margin-top: 5px;">
                <label>التصدير والحفظ:</label>
                <button class="action-btn" onclick="exportTransparentPNG()">تحميل كصورة شفافة (Transparent PNG)</button>
                <button class="action-btn" style="background:#8b5a2b;" onclick="exportPDF()">تحميل كملف PDF</button>
                <button onclick="clearCanvas()" style="background:#f2dede; color:#a94442; border-color:#ebccd1;">مسح اللوحة بالكامل</button>
            </div>

            <!-- قسم المشرف (خاص بالأستاذ يوسف حصرياً) -->
            <div class="admin-section" id="adminSection">
                <label style="color: var(--accent);">إدارة النماذج الخاصة (المشرف):</label>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 5px;">
                    <input type="text" id="newPresetName" placeholder="اسم النموذج الجديد...">
                    <button onclick="addNewPreset()" style="background: var(--accent); color:#fff; border:none; padding:6px; border-radius:4px; font-size:0.8rem;">حفظ التصميم كنموذج جاهز</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('kuficCanvas');
        const ctx = canvas.getContext('2d');

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const innerRadius = 110;
        const outerRadius = 230;

        let rings = 5;
        let sectors = 36;
        let isLocked = false;
        let currentTool = 1; // 1: أسود, 2: ذهبي, 0: ممحاة

        let gridState = Array(rings).fill().map(() => Array(sectors).fill(0));

        // نماذج جاهزة أولية
        let customPresets = {
            "empty": Array(5).fill().map(() => Array(36).fill(0))
        };

        function drawGrid(isExporting = false, transparentBg = false) {
            const width = canvas.width;
            const height = canvas.height;

            if (isExporting && transparentBg) {
                ctx.clearRect(0, 0, width, height);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);
            }

            const dr = (outerRadius - innerRadius) / rings;
            const da = (Math.PI * 2) / sectors;

            for (let r = 0; r < rings; r++) {
                let rIn = innerRadius + r * dr;
                let rOut = innerRadius + (r + 1) * dr;

                for (let s = 0; s < sectors; s++) {
                    let aStart = s * da;
                    let aEnd = (s + 1) * da;

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, rIn, aStart, aEnd, false);
                    ctx.arc(centerX, centerY, rOut, aEnd, aStart, true);
                    ctx.closePath();

                    if (gridState[r][s] === 1) {
                        ctx.fillStyle = '#111111';
                        ctx.fill();
                    } else if (gridState[r][s] === 2) {
                        ctx.fillStyle = '#c5a059';
                        ctx.fill();
                    } else if (!isExporting) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                    }

                    if (!isExporting) {
                        ctx.strokeStyle = '#e6e0d4';
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            // رسم حدود دائرية رئيسية جمالية عند التصدير
            if (isExporting) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, outerRadius, 0, Math.PI * 2);
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        let isMouseDown = false;

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            handleCanvasInteraction(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                handleCanvasInteraction(e);
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        function handleCanvasInteraction(event) {
            const rect = canvas.getBoundingClientRect();
            // حساب الإحداثيات بالنسبة لحجم الـ Canvas الفعلي
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX - centerX;
            const y = (event.clientY - rect.top) * scaleY - centerY;
            
            const dist = Math.sqrt(x * x + y * y);
            let angle = Math.atan2(y, x);
            if (angle < 0) angle += Math.PI * 2;

            const dr = (outerRadius - innerRadius) / rings;
            const da = (Math.PI * 2) / sectors;

            if (dist >= innerRadius && dist <= outerRadius) {
                let r = Math.floor((dist - innerRadius) / dr);
                let s = Math.floor(angle / da);

                if (r >= 0 && r < rings && s >= 0 && s < sectors) {
                    if (gridState[r][s] !== currentTool) {
                        gridState[r][s] = currentTool;
                        drawGrid();
                    }
                }
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('toolBlack').classList.remove('active');
            document.getElementById('toolGold').classList.remove('active');
            document.getElementById('toolEraser').classList.remove('active');

            if (tool === 1) document.getElementById('toolBlack').classList.add('active');
            if (tool === 2) document.getElementById('toolGold').classList.add('active');
            if (tool === 0) document.getElementById('toolEraser').classList.add('active');
        }

        function toggleGridLock() {
            isLocked = !isLocked;
            const btn = document.getElementById('lockBtn');
            const statusText = document.getElementById('lockStatusText');
            const settingsGroup = document.getElementById('gridSettingsGroup');

            if (isLocked) {
                btn.textContent = 'إلغاء القفل';
                btn.style.background = '#d48806';
                btn.style.color = '#fff';
                statusText.textContent = '🔒 الشبكية مقفلة (محمية من التغيير)';
                settingsGroup.style.opacity = '0.4';
                settingsGroup.style.pointerEvents = 'none';
            } else {
                btn.textContent = 'قفل الشبكية';
                btn.style.background = '';
                btn.style.color = '';
                statusText.textContent = '🔓 الشبكية مفتوحة للتعديل';
                settingsGroup.style.opacity = '1';
                settingsGroup.style.pointerEvents = 'auto';
            }
        }

        function updateGridDimensions() {
            if (isLocked) return;
            const newRings = parseInt(document.getElementById('ringsRange').value);
            const newSectors = parseInt(document.getElementById('sectorsRange').value);

            if (newRings !== rings || newSectors !== sectors) {
                rings = newRings;
                sectors = newSectors;
                gridState = Array(rings).fill().map(() => Array(sectors).fill(0));
                drawGrid();
            }
        }

        function clearCanvas() {
            gridState = Array(rings).fill().map(() => Array(sectors).fill(0));
            drawGrid();
        }

        function exportTransparentPNG() {
            drawGrid(true, true);
            const link = document.createElement('a');
            link.download = 'circular-kufic-design.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            drawGrid(false, false);
        }

        function exportPDF() {
            drawGrid(true, false);
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            const pageWidth = pdf.internal.pageSize.getWidth();
            const imgSize = 140;
            const xPos = (pageWidth - imgSize) / 2;

            pdf.setFontSize(18);
            pdf.text('تكوين للخط الكوفي الدائري', pageWidth / 2, 25, { align: 'center' });
            
            pdf.setFontSize(11);
            pdf.setTextColor(139, 90, 43);
            pdf.text('تصميم الاستاذ : يوسف حمد الصييفي', pageWidth / 2, 33, { align: 'center' });

            pdf.addImage(imgData, 'PNG', xPos, 45, imgSize, imgSize);
            pdf.save('circular-kufic-design.pdf');
            drawGrid(false, false);
        }

        function addNewPreset() {
            const name = document.getElementById('newPresetName').value.trim();
            if (!name) {
                alert('الرجاء إدخال اسم للنموذج');
                return;
            }
            customPresets[name] = JSON.parse(JSON.stringify(gridState));
            
            const select = document.getElementById('presetsSelect');
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            select.appendChild(option);

            document.getElementById('newPresetName').value = '';
            alert('تم حفظ النموذج بنجاح وإضافته لقائمة النماذج الجاهزة!');
        }

        function loadPreset() {
            const val = document.getElementById('presetsSelect').value;
            if (!val) return;
            if (customPresets[val]) {
                gridState = JSON.parse(JSON.stringify(customPresets[val]));
                rings = gridState.length;
                sectors = gridState[0].length;
                document.getElementById('ringsRange').value = rings;
                document.getElementById('sectorsRange').value = sectors;
                drawGrid();
            }
        }

        // الرسم الأولي
        drawGrid();
    </script>
</body>
</html>
